<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA VI - Compte à rebours</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .widget-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 0, 127, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: #121212;
    }

    /* Image de fond depuis CDN haute qualité */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://images.alphacoders.com/134/1344447.png');
      background-size: cover;
      background-position: center;
      filter: brightness(0.65) contrast(1.1);
      z-index: 1;
    }

    /* Dégradé néon Vice City */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(255, 0, 127, 0.25) 0%, rgba(0, 210, 255, 0.2) 100%);
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 3;
      padding: 30px 20px;
      text-align: center;
      backdrop-filter: blur(2px);
    }

    .logo-title {
      font-size: 2.2rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #ff007f, #00d2ff, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 25px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .time-box {
      background: rgba(10, 10, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 12px 5px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    .number {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
    }

    .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #ff007f;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .release-date {
      font-size: 0.8rem;
      font-weight: 600;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.7);
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="bg-image"></div>
    <div class="overlay"></div>
    <div class="content">
      <div class="logo-title">Grand Theft Auto VI</div>
      <div class="subtitle">Sortie Officielle</div>

      <div class="countdown-grid">
        <div class="time-box">
          <div class="number" id="days">00</div>
          <div class="label">Jours</div>
        </div>
        <div class="time-box">
          <div class="number" id="hours">00</div>
          <div class="label">Heures</div>
        </div>
        <div class="time-box">
          <div class="number" id="minutes">00</div>
          <div class="label">Min</div>
        </div>
        <div class="time-box">
          <div class="number" id="seconds">00</div>
          <div class="label">Sec</div>
        </div>
      </div>

      <div class="release-date">19 NOVEMBRE 2026</div>
    </div>
  </div>

  <script>
    const targetDate = new Date("November 19, 2026 00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days < 10 ? "0" + days : days;
        document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
        document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
        document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
      } else {
        document.querySelector(".countdown-grid").innerHTML = "<div style='grid-column: span 4; font-size: 1.5rem; color: #00d2ff; font-weight: bold;'>DISPONIBLE MAINTENANT !</div>";
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
